services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    image: shoplite-api:v1
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      APP_VERSION: v1
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

volumes:
  redis-data:

networks:
  backend: